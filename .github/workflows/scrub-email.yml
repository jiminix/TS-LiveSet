name: Scrub personal email from Git history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scrub-email.yml"

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rewrite author and committer email
        shell: bash
        run: |
          set -euo pipefail

          OLD_EMAIL="jiminix@gmail.com"
          NEW_EMAIL="1089106+jiminix@users.noreply.github.com"

          git fetch --force --tags origin

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --env-filter '
          if [ "$GIT_AUTHOR_EMAIL" = "'"$OLD_EMAIL"'" ]; then
              export GIT_AUTHOR_EMAIL="'"$NEW_EMAIL"'"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "'"$OLD_EMAIL"'" ]; then
              export GIT_COMMITTER_EMAIL="'"$NEW_EMAIL"'"
          fi
          ' --tag-name-filter cat -- main viewer-latest

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin || true
          git reflog expire --expire=now --all
          git gc --prune=now

          if git log main viewer-latest --format='%ae%n%ce' | grep -F "$OLD_EMAIL"; then
              echo "Old email still found after rewrite."
              exit 1
          fi

          git push --force origin main
          git push --force origin refs/tags/viewer-latest

      - name: Verify rewritten history
        shell: bash
        run: |
          if git log main viewer-latest --format='%ae%n%ce' | grep -F "jiminix@gmail.com"; then
              exit 1
          fi
          echo "Personal email removed from main and viewer-latest."
