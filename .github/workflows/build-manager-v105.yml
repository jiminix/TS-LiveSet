name: Build Manager V1.05 (stable signature)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-v105:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore permanent V1.05 signing key from encrypted GitHub secret
        env:
          KEYSTORE_B64: ${{ secrets.MANAGER_V105_KEYSTORE_BASE64 }}
          EXPECTED_SHA256: ${{ vars.MANAGER_V105_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ -z "$KEYSTORE_B64" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::Configure MANAGER_V105_KEYSTORE_BASE64 secret and MANAGER_V105_CERT_SHA256 variable before building."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > .signing/liveset-debug.keystore
          chmod 600 .signing/liveset-debug.keystore
          ACTUAL="$(keytool -list -v -keystore .signing/liveset-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::V1.05 signing fingerprint mismatch; refusing to produce an incompatible APK."
            exit 1
          fi
      - name: Normalize Android drawable names
        run: |
          for dir in app/src/main/res/drawable viewer/src/main/res/drawable; do
            for file in "$dir"/Meryl_*.png; do
              [ -f "$file" ] || continue
              mv "$file" "$(dirname "$file")/$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            done
          done
      - name: Build V1.05 Manager APK
        run: gradle :app:assembleDebug
      - name: Upload V1.05 Manager
        uses: actions/upload-artifact@v4
        with:
          name: TS-Playlist-Manager-V1.05-stable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
