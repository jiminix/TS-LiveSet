name: Build isolated Manager recovery test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-recovery-test.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: .signing/liveset-debug.keystore
          key: liveset-permanent-signing-v1
      - name: Prepare isolated test application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Android resource filenames must be lowercase; normalize both uploaded logos.
          for folder in (Path('app/src/main/res/drawable'),Path('viewer/src/main/res/drawable')):
              for source in folder.glob('Meryl_*.png'):
                  source.rename(source.with_name(source.name.lower()))
          gradle=Path('app/build.gradle')
          data=gradle.read_text()
          assert "applicationId 'com.jiminix.liveset'" in data
          data=data.replace("applicationId 'com.jiminix.liveset'","applicationId 'com.jiminix.liveset.recoverytest'")
          data=data.replace('versionCode 87','versionCode 88')
          data=data.replace("versionName '0.87'","versionName '0.88-test'")
          gradle.write_text(data)
          manifest=Path('app/src/main/AndroidManifest.xml')
          data=manifest.read_text()
          assert 'com.jiminix.liveset.playlists' in data
          data=data.replace('com.jiminix.liveset.playlists','com.jiminix.liveset.recoverytest.playlists')
          data=data.replace('com.jiminix.liveset.permission.READ_VIEWER','com.jiminix.liveset.recoverytest.permission.READ_VIEWER')
          data=data.replace('android:label="TS Playlist Manager"','android:label="Manager TEST 0.88"')
          # Use the existing manager artwork as a standard launcher icon in the isolated APK.
          data=data.replace('android:icon="@drawable/ic_launcher_manager"', 'android:icon="@mipmap/ic_launcher"')
          manifest.write_text(data)
          icon=Path('app/src/main/res/drawable/meryl_20261011_161701_0000.png')
          assert icon.is_file(), 'Manager custom icon not found'
          target=Path('app/src/main/res/mipmap-nodpi/ic_launcher.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(icon.read_bytes())
          # Use the same artwork for adaptive launcher icons on recent Samsung phones.
          adaptive=Path('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')
          adaptive.parent.mkdir(parents=True,exist_ok=True)
          adaptive.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@android:color/black"/>\n    <foreground android:drawable="@mipmap/ic_launcher"/>\n</adaptive-icon>\n''')
          PY
          test -f .signing/liveset-debug.keystore
      - name: Build recovery test APK
        run: gradle :app:assembleDebug
      - name: Upload recovery test APK
        uses: actions/upload-artifact@v4
        with:
          name: Manager-TEST-0.88-custom-icon
          path: app/build/outputs/apk/debug/app-debug.apk
