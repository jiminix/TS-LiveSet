name: Build LiveSet APK
# signing-cache verification
# V0.8 table parser build
# V0.9 playlist overview
# V0.10 compact playlist
# V0.11 library render fix
# V0.12 startup routing
# V0.13 fixed access buttons
# V0.14 horizontal playlist header
# V0.15 unified headers
# V0.16 drag playlist and smaller lyrics
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: liveset-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing directory
        run: mkdir -p .signing

      - name: Restore permanent LiveSet signing key
        uses: actions/cache@v4
        with:
          path: .signing/liveset-debug.keystore
          key: liveset-permanent-signing-v1

      - name: Create signing key once
        run: |
          if [ ! -f .signing/liveset-debug.keystore ]; then
            keytool -genkeypair -noprompt               -keystore .signing/liveset-debug.keystore               -storetype JKS               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=TS LiveSet,O=TS LiveSet,C=FR"
          fi
          test -f .signing/liveset-debug.keystore
          keytool -list -keystore .signing/liveset-debug.keystore -storepass android -alias androiddebugkey

      - name: Build debug APKs
        run: gradle :app:assembleDebug :viewer:assembleDebug

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: TS-LiveSet-Manager-V0.37-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: TS-Playlist-Viewer-V0.6-debug
          path: viewer/build/outputs/apk/debug/viewer-debug.apk
