name: Build LiveSet APK
# signing-cache verification
# V0.8 table parser build
# V0.9 playlist overview
# V0.10 compact playlist
# V0.11 library render fix
# V0.12 startup routing
# V0.13 fixed access buttons
# V0.14 horizontal playlist header
# V0.15 unified headers
# V0.16 drag playlist and smaller lyrics
# V0.28 current Android Viewer build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: liveset-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing directory
        run: mkdir -p .signing

      - name: Restore permanent LiveSet signing key
        uses: actions/cache@v4
        with:
          path: .signing/liveset-debug.keystore
          key: liveset-permanent-signing-v1

      - name: Verify permanent signing key
        run: |
          if [ ! -f .signing/liveset-debug.keystore ]; then
            echo "::error::Permanent signing key missing from Actions cache. Build stopped to prevent incompatible APK signatures."
            exit 1
          fi
          keytool -list -keystore .signing/liveset-debug.keystore -storepass android -alias androiddebugkey

      - name: Normalize uploaded drawable resource names
        run: |
          for dir in app/src/main/res/drawable viewer/src/main/res/drawable; do
            for file in "$dir"/Meryl_*.png; do
              [ -f "$file" ] || continue
              mv "$file" "$(dirname "$file")/$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            done
          done

      - name: Build debug APKs
        run: gradle :app:assembleDebug :viewer:assembleDebug

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: TS-LiveSet-Manager-V0.47-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Viewer APK
        uses: actions/upload-artifact@v4
        with:
          name: TS-Playlist-Viewer-V0.28-debug
          path: viewer/build/outputs/apk/debug/viewer-debug.apk

      - name: Publish stable Viewer updater APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIEWER_VERSION="$(grep '^Viewer V' VERSION | sed 's/^Viewer V//')"
          cp viewer/build/outputs/apk/debug/viewer-debug.apk TS-Playlist-Viewer.apk

          if gh release view viewer-latest >/dev/null 2>&1; then
            gh release upload viewer-latest TS-Playlist-Viewer.apk --clobber
            gh release edit viewer-latest               --title "TS Playlist Viewer V${VIEWER_VERSION}"               --notes "APK de mise à jour automatique du Viewer V${VIEWER_VERSION}."
          else
            gh release create viewer-latest TS-Playlist-Viewer.apk               --title "TS Playlist Viewer V${VIEWER_VERSION}"               --notes "APK de mise à jour automatique du Viewer V${VIEWER_VERSION}."
          fi
