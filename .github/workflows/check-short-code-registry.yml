name: Check short-code registry
# refresh current registry

on:
  push:
    paths:
      - '.github/workflows/check-short-code-registry.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch registry and Y6 target
        run: |
          set -euo pipefail
          curl -fsS 'https://superjsonblob.com/api/jsonBlob/95af90a8-317b-4588-b7ab-5153db677527' -o registry.json
          blob=$(jq -r '.slots.Y6.blob // empty' registry.json)
          test -n "$blob"
          curl -fsS "https://superjsonblob.com/api/jsonBlob/$blob" -o target.json
          cat registry.json
          cat target.json

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: TS-short-code-diagnostic
          path: |
            registry.json
            target.json
