plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jiminix.livesetviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jiminix.livesetviewer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    signingConfigs {
        stableDebug {
            storeFile rootProject.file('.signing/liveset-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
